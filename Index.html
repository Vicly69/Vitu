<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TheraPoint Pro - 361 Pontos & 100 Protocolos Clínicos</title>
  <meta name="theme-color" content="#0f766e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { -webkit-tap-highlight-color: transparent; user-select: none; }
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .cat-pill.active { background-color: #0f766e !important; color: white !important; }
    .meridian-pill.active { background-color: #0f766e !important; color: white !important; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header Superior Fixo -->
  <header class="bg-teal-800 text-white px-4 pt-4 pb-3 sticky top-0 z-20 shadow-md">
    <div class="flex justify-between items-center mb-2.5">
      <div>
        <span class="text-[10px] font-bold text-teal-300 uppercase tracking-wider">MTC & Massoterapia</span>
        <h1 class="text-lg font-bold flex items-center gap-1.5">
          <i class="fa-solid fa-yin-yang text-teal-300"></i> TheraPoint Pro
        </h1>
      </div>
      <div class="flex items-center gap-1.5">
        <span id="counterBadge" class="text-[10px] bg-teal-900 px-2.5 py-0.5 rounded-full text-teal-200 border border-teal-700 font-mono font-bold">100 Condutas</span>
      </div>
    </div>

    <!-- Barra de Busca Universal Inteligente -->
    <div class="relative">
      <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
      <input 
        id="searchInput" 
        type="text" 
        placeholder="Buscar dor, queixa (ex: ciática, insônia, ombro)..." 
        class="w-full pl-9 pr-9 py-2 bg-white text-slate-800 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-400 shadow-sm"
        oninput="executarBusca()"
        onkeyup="executarBusca()"
      />
      <button id="clearBtn" class="hidden absolute right-3 top-2.5 text-slate-400 hover:text-slate-600" onclick="limparBusca()">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>
  </header>

  <!-- Filtros de Categorias -->
  <div id="categoryBar" class="bg-white border-b border-slate-200 px-3 py-2 flex gap-2 overflow-x-auto custom-scroll shrink-0">
    <button onclick="selecionarCategoria('Todos', this)" class="cat-pill active px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap bg-teal-800 text-white">Todos (100)</button>
    <button onclick="selecionarCategoria('Coluna & Dor', this)" class="cat-pill px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap bg-slate-100 text-slate-600">Coluna & Dor (25)</button>
    <button onclick="selecionarCategoria('Membros & Articulações', this)" class="cat-pill px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap bg-slate-100 text-slate-600">Membros (25)</button>
    <button onclick="selecionarCategoria('Emocional & Estresse', this)" class="cat-pill px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap bg-slate-100 text-slate-600">Emocional (25)</button>
    <button onclick="selecionarCategoria('Sistêmico & Digestivo', this)" class="cat-pill px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap bg-slate-100 text-slate-600">Sistêmico (25)</button>
  </div>

  <!-- Barra Seletora dos 14 Meridianos -->
  <div id="meridianBar" class="hidden bg-slate-50 border-b border-slate-200 px-3 py-2 overflow-x-auto custom-scroll shrink-0">
    <div class="flex gap-1.5" id="meridianButtons"></div>
  </div>

  <!-- Conteúdo Principal -->
  <main id="mainContainer" class="flex-1 p-3 pb-24 overflow-y-auto custom-scroll">
    <div id="tabProtocolos" class="space-y-3"></div>
    <div id="tabPontos" class="hidden space-y-2.5"></div>
  </main>

  <!-- Modal Detalhado -->
  <div id="protocolModal" class="hidden fixed inset-0 bg-black/60 z-30 flex flex-col justify-end">
    <div class="bg-white rounded-t-3xl max-h-[92vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="p-3.5 border-b border-slate-200 flex justify-between items-center bg-slate-50">
        <span id="modalCategoria" class="text-[10px] font-bold uppercase tracking-wider text-teal-700 bg-teal-50 px-2 py-0.5 rounded border border-teal-200"></span>
        <button onclick="fecharModal()" class="w-8 h-8 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="p-4 overflow-y-auto custom-scroll space-y-4 text-slate-800">
        <div>
          <h2 id="modalTitulo" class="text-lg font-black text-slate-900 leading-snug"></h2>
          <p id="modalResumo" class="text-xs text-slate-500 mt-1"></p>
        </div>

        <div class="bg-rose-50 border-l-4 border-rose-500 p-3 rounded-r-lg">
          <div class="flex items-center gap-1.5 text-rose-800 font-bold text-xs mb-1">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span>ALERTAS & CONTRAINDICAÇÕES</span>
          </div>
          <p id="modalContraindicacoes" class="text-xs text-rose-950 leading-relaxed"></p>
        </div>

        <div class="bg-teal-50 border border-teal-200 rounded-xl p-3.5">
          <div class="flex items-center justify-between mb-1.5">
            <span class="font-bold text-teal-950 text-xs flex items-center gap-1.5">
              <i class="fa-solid fa-bullseye text-teal-700"></i> Conduta com Ventosas
            </span>
            <span id="modalTempoVentosa" class="text-[10px] bg-teal-100 text-teal-900 font-black px-2.5 py-0.5 rounded-full"></span>
          </div>
          <p id="modalVentosaDesc" class="text-xs text-slate-800 leading-relaxed"></p>
        </div>

        <div class="bg-amber-50 border border-amber-200 rounded-xl p-3.5">
          <span class="font-bold text-amber-950 text-xs flex items-center gap-1.5 mb-1.5">
            <i class="fa-solid fa-hands text-amber-700"></i> Manobras de Massoterapia
          </span>
          <p id="modalMassagemDesc" class="text-xs text-slate-800 leading-relaxed"></p>
        </div>

        <div>
          <h3 class="font-bold text-slate-900 text-xs mb-2.5 flex items-center gap-1.5">
            <i class="fa-solid fa-location-dot text-teal-700"></i> Pontos Indicados para Palpação
          </h3>
          <div id="modalPontosList" class="space-y-2.5"></div>
        </div>
      </div>

      <div class="p-3 border-t border-slate-100 bg-white">
        <button onclick="fecharModal()" class="w-full py-3 bg-teal-800 text-white rounded-xl font-bold text-sm">
          Fechar Conduta
        </button>
      </div>
    </div>
  </div>

  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-2.5 px-6 flex justify-around items-center z-10 shadow-lg">
    <button id="navProt" onclick="mudarAba('protocolos')" class="flex flex-col items-center text-teal-800 font-semibold">
      <i class="fa-solid fa-book-medical text-xl"></i>
      <span class="text-[10px] mt-1">100 Protocolos</span>
    </button>
    <button id="navPontos" onclick="mudarAba('pontos')" class="flex flex-col items-center text-slate-400">
      <i class="fa-solid fa-network-wired text-xl"></i>
      <span class="text-[10px] mt-1">361 Pontos MTC</span>
    </button>
  </nav>

  <script>
    const MERIDIANOS = [
      { id: "TODOS", nome: "Todos", total: 361 },

      { id: "VG", nome: "Vaso Governador (VG)", total: 28 }, { id: "VC", nome: "Vaso Concepção (VC)", total: 24 }

    let BANCO_PONTOS_MTC = {"P1": {"canal": "P", "nome": "Zhongfu", "pinyin": "Zhōngfǔ", "local": "6 cun lateral à linha média anterior, no 1º espaço intercostal, abaixo da clavícula.", "funcao": "Ponto Mu do Pulmão. Tosse, asma, dor no peito e plenitude pulmonar."}, "P2": {"canal": "P", "nome": "Yunmen", "pinyin": "Yúnmén", "local": "6 cun lateral à linha média, na depressão da fossa infraclavicular.", "funcao": "Tosse, dispneia, dor no ombro e opressão torácica."}, "P3": {"canal": "P", "nome": "Tianfu", "pinyin": "Tiānfǔ", "local": "Face anterolateral do braço, 3 cun abaixo da prega axilar anterior.", "funcao": "Asma, epistaxe, dor na face medial do braço e dispneia."}, "P4": {"canal": "P", "nome": "Xiabai", "pinyin": "Xiábái", "local": "Face anterolateral do braço, 4 cun abaixo da prega axilar anterior.", "funcao": "Tosse, dor no peito, palpitação e dor no braço."}, "P5": {"canal": "P", "nome": "Chize", "pinyin": "Chǐzé", "local": "Na prega do cotovelo, na depressão radial ao tendão do bíceps braquial.", "funcao": "Ponto He-Mar. Tosse, febre, dor de garganta, dor no cotovelo e calor pulmonar."}, "P6": {"canal": "P", "nome": "Kongzui", "pinyin": "Kǒngzuì", "local": "Face anterolateral do antebraço, 7 cun acima da prega distal do punho.", "funcao": "Ponto Xi-Fenda. Hemoptise, tosse aguda, asma aguda e dor no antebraço."}, "P7": {"canal": "P", "nome": "Lieque", "pinyin": "Lièquē", "local": "1,5 cun proximal à prega do punho, acima do processo estiloide do rádio.", "funcao": "Ponto Luo e Conexão Ren Mai. Cefaleia, rigidez de nuca, desvio facial e tosse."}, "P8": {"canal": "P", "nome": "Jingqu", "pinyin": "Jīngqú", "local": "1 cun proximal à prega do punho, no sulco da artéria radial.", "funcao": "Ponto Jing-Rio. Tosse, asma, dor no punho e dor de garganta."}, "P9": {"canal": "P", "nome": "Taiyuan", "pinyin": "Tàiyuān", "local": "Na prega do punho, na depressão radial à artéria radial.", "funcao": "Ponto Yuan e Shu-Riacho. Tonificação do Qi pulmonar, tosse crônica e pulso fraco."}, "P10": {"canal": "P", "nome": "Yuji", "pinyin": "Yújì", "local": "Ponto médio do 1º osso metacarpo, na junção da pele branca e vermelha.", "funcao": "Ponto Ying-Manancial. Dor de garganta severa, rouquidão, afonia e calor pulmonar."}, "P11": {"canal": "P", "nome": "Shaoshang", "pinyin": "Shàoshāng", "local": "Bordo radial do polegar, 0,1 cun do ângulo da raiz da unha.", "funcao": "Ponto Jing-Poço. Emergência, síncope, faringite aguda e febre alta."}, "IG1": {"canal": "IG", "nome": "Shangyang", "pinyin": "Shāngyáng", "local": "Bordo radial do indicador, 0,1 cun do ângulo ungueal.", "funcao": "Ponto Jing-Poço. Alívio de febre alta, perda de consciência e dor de dente."}, "IG2": {"canal": "IG", "nome": "Erjian", "pinyin": "Èrjiān", "local": "Depressão distal à articulação metacarpofalângica do 2º dedo, bordo radial.", "funcao": "Ponto Ying-Manancial. Clareia calor, odontalgia mandibular e faringite."}, "IG3": {"canal": "IG", "nome": "Sanjian", "pinyin": "Sānjiān", "local": "Depressão proximal à articulação metacarpofalângica do 2º metacarpo.", "funcao": "Ponto Shu-Riacho. Dor nos dedos, plenitude abdominal e inflamação na garganta."}, "IG4": {"canal": "IG", "nome": "Hegu", "pinyin": "Hégǔ", "local": "Dorso da mão, entre 1º e 2º metacarpos, ponto médio da borda radial do 2º.", "funcao": "Ponto Yuan e Mestre da Face. Analgesia potente de cabeça, dentes e face. Contraindicado na gestação."}, "IG5": {"canal": "IG", "nome": "Yangxi", "pinyin": "Yángxī", "local": "Face radial do punho, no centro da tabaqueira anatômica.", "funcao": "Ponto Jing-Rio. Cefaleia frontal, dor no punho, zumbido e olhos vermelhos."}, "IG6": {"canal": "IG", "nome": "Pianli", "pinyin": "Piānlì", "local": "3 cun proximal à prega do punho (IG5), linha que une IG5 a IG11.", "funcao": "Ponto Luo. Edema facial e membros superiores, epistaxe e paralisia vocal."}, "IG7": {"canal": "IG", "nome": "Wenliu", "pinyin": "Wēnliū", "local": "5 cun proximal à prega do punho (IG5), face lateral do rádio.", "funcao": "Ponto Xi-Fenda. Borborigmos, dor aguda no membro superior e gengivite."}, "IG8": {"canal": "IG", "nome": "Xialian", "pinyin": "Xiàlián", "local": "4 cun distal a IG11, na linha que une IG5 a IG11.", "funcao": "Dor no cotovelo e antebraço, dor abdominal periumbilical."}, "IG9": {"canal": "IG", "nome": "Shanglian", "pinyin": "Shànglián", "local": "3 cun distal a IG11, face radial do músculo braquiorradial.", "funcao": "Dormência no membro superior, artralgia de ombro e cólica intestinal."}, "IG10": {"canal": "IG", "nome": "Shousanli", "pinyin": "Shǒusānlǐ", "local": "2 cun distal a IG11, na saliência do músculo extensor radial longo do carpo.", "funcao": "Tonificação do Qi do braço, dor dentária, diarreia e epicondilite lateral."}, "IG11": {"canal": "IG", "nome": "Quchi", "pinyin": "Qūchí", "local": "Cotovelo fletido a 90°, depressão na extremidade lateral da prega cubital.", "funcao": "Ponto He-Mar. Dispersão de febre, inflamações cutâneas, hipertensão e dor no braço."}, "IG12": {"canal": "IG", "nome": "Zhouliao", "pinyin": "Zhǒuliáo", "local": "Cotovelo fletido, 1 cun proximal e lateral a IG11, borda medial do úmero.", "funcao": "Dor e rigidez no cotovelo, epicondilite crônica e perda funcional."}, "IG13": {"canal": "IG", "nome": "Shouwuli", "pinyin": "Shǒuwǔlǐ", "local": "3 cun proximal a IG11, borda lateral do bíceps braquial.", "funcao": "Tosse, escrófula, dor no braço e espasmo muscular."}, "IG14": {"canal": "IG", "nome": "Binao", "pinyin": "Bìnào", "local": "Inserção inferior do músculo deltoide, 7 cun proximal a IG11.", "funcao": "Olhos vermelhos e doloridos, escrófula, dor no ombro e tendinite do bíceps."}, "IG15": {"canal": "IG", "nome": "Jianyu", "pinyin": "Jiānyú", "local": "Depressão anteroinferior ao acrômio com braço abduzido a 90°.", "funcao": "Ponto mestre de ombro, bursite, manguito rotador e capsulite adesiva."}, "IG16": {"canal": "IG", "nome": "Jugu", "pinyin": "Jùgǔ", "local": "Depressão entre a extremidade acromial da clavícula e espinha escapular.", "funcao": "Dor na cintura escapular, rigidez ao elevar o braço e dor interescapular."}, "IG17": {"canal": "IG", "nome": "Tianding", "pinyin": "Tiāndǐng", "local": "Face lateral do pescoço, borda posterior do ECOM, 1 cun inferior a IG18.", "funcao": "Faringite, afonia súbita, bócio e dificuldade de deglutição."}, "IG18": {"canal": "IG", "nome": "Futu", "pinyin": "Fútú", "local": "Pescoço, entre as cabeças do ECOM, no nível da cartilagem tireóidea.", "funcao": "Tosse com fleuma abundante, asma, faringite e disfonia."}, "IG19": {"canal": "IG", "nome": "Kouheliao", "pinyin": "Kǒuhéliáo", "local": "Abaixo da margem lateral da asa nasal, 0,5 cun lateral a VG26.", "funcao": "Paralisia facial periférica, desvio labial e congestão nasal."}, "IG20": {"canal": "IG", "nome": "Yingxiang", "pinyin": "Yíngxiāng", "local": "No sulco nasolabial, no nível do ponto médio da asa do nariz.", "funcao": "Rinite, sinusite, perda de olfato, coriza e obstrução nasal."}, "E1": {"canal": "E", "nome": "Chengqi", "pinyin": "Chéngqì", "local": "Entre o globo ocular e bordo infraorbital inferior, linha da pupila.", "funcao": "Conjuntivite, lacrimejamento ao vento e atrofia óptica."}, "E2": {"canal": "E", "nome": "Sibai", "pinyin": "Sìbái", "local": "Depressão do forame infraorbital, 0,3 cun abaixo do bordo inferior orbital.", "funcao": "Paralisia facial, nevralgia do trigêmeo e dor ocular."}, "E3": {"canal": "E", "nome": "Juliao", "pinyin": "Jùliáo", "local": "Abaixo da pupila, no nível da borda inferior da asa nasal.", "funcao": "Nevralgia de trigêmeo, paralisia de Bell e inchaço facial."}, "E4": {"canal": "E", "nome": "Dicang", "pinyin": "Dìcāng", "local": "0,4 cun lateral à comissura labial, na linha da pupila.", "funcao": "Desvio da boca em AVC, sialorreia involuntária e tiques faciais."}, "E5": {"canal": "E", "nome": "Daying", "pinyin": "Dàyíng", "local": "Anterior ao ângulo mandibular, borda anterior do masseter.", "funcao": "Trismo, dor de dente inferior e espasmo facial     let abaAtual = "protocolos";
    let categoriaAtual = "Todos";
    let meridianoAtual = "TODOS";

    async function carregarBancoPontos() {
      try {
        const resp = await fetch('https://cdn.jsdelivr.net/gh/m-d-m-s/acupoints-json@main/points.json');
        const data = await resp.json();
        data.forEach(pt => {
          BANCO_PONTOS_MTC[pt.code] = {
            canal: pt.meridian || pt.code.replace(/[0-9]/g, ''),
            nome: pt.name || pt.pinyin,
            pinyin: pt.pinyin || "",
            local: pt.location || "Localização anatômica oficial de palpação.",
            funcao: pt.indications || "Indicação clínica tradicional."
          };
        });
      } catch (e) {
        console.log("Modo offline ativo.");
      }
    }

    function normalizarTexto(txt) {
      if (!txt) return "";
      return txt.toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    }

    function inicializarBarraMeridianos() {
      const container = document.getElementById("meridianButtons");
      container.innerHTML = MERIDIANOS.map(m => `
        <button onclick="selecionarMeridiano('${m.id}', this)" class="meridian-pill ${m.id === 'TODOS' ? 'active bg-teal-800 text-white' : 'bg-white text-slate-700 border border-slate-200'} px-2.5 py-1 rounded-lg text-xs font-semibold whitespace-nowrap active:scale-95 transition">
          ${m.nome} <span class="text-[10px] opacity-75 font-mono">(${m.total})</span>
        </button>
      `).join('');
    }

    function mudarAba(aba) {
      abaAtual = aba;
      const tabProt = document.getElementById("tabProtocolos");
      const tabPts = document.getElementById("tabPontos");
      const catBar = document.getElementById("categoryBar");
      const merBar = document.getElementById("meridianBar");
      const navProt = document.getElementById("navProt");
      const navPontos = document.getElementById("navPontos");

      if (aba === "protocolos") {
        tabProt.classList.remove("hidden");
        tabPts.classList.add("hidden");
        catBar.classList.remove("hidden");
        merBar.classList.add("hidden");
        navProt.className = "flex flex-col items-center text-teal-800 font-semibold";
        navPontos.className = "flex flex-col items-center text-slate-400 hover:text-slate-600";
        document.getElementById("searchInput").placeholder = "Buscar entre 100 protocolos (ex: ciática, insônia)...";
        filtrarProtocolos();
      } else {
        tabProt.classList.add("hidden");
        tabPts.classList.remove("hidden");
        catBar.classList.add("hidden");
        merBar.classList.remove("hidden");
        navProt.className = "flex flex-col items-center text-slate-400 hover:text-slate-600";
        navPontos.className = "flex flex-col items-center text-teal-800 font-semibold";
        document.getElementById("searchInput").placeholder = "Buscar entre os 361 pontos (código, nome, sintoma)...";
        renderizarPontosMeridiano();
      }
    }

    function selecionarMeridiano(meridianoId, elemento) {
      meridianoAtual = meridianoId;
      document.querySelectorAll(".meridian-pill").forEach(btn => {
        btn.className = "meridian-pill bg-white text-slate-700 border border-slate-200 px-2.5 py-1 rounded-lg text-xs font-semibold whitespace-nowrap active:scale-95 transition";
      });
      elemento.className = "meridian-pill active bg-teal-800 text-white px-2.5 py-1 rounded-lg text-xs font-semibold whitespace-nowrap active:scale-95 transition";
      renderizarPontosMeridiano();
    }

    function renderizarProtocolos(itens) {
      const container = document.getElementById("tabProtocolos");
      container.innerHTML = "";
      document.getElementById("counterBadge").innerText = `${itens.length} Condutas`;

      if (itens.length === 0) {
        container.innerHTML = `<div class="text-center py-16 text-slate-400"><p class="text-xs font-semibold">Nenhuma conduta encontrada.</p></div>`;
        return;
      }

      itens.forEach(q => {
        const card = document.createElement("div");
        card.className = "bg-white p-4 rounded-2xl border border-slate-200 shadow-sm active:scale-[0.99] transition cursor-pointer hover:border-teal-400";
        card.onclick = () => abrirModal(q.id);
        card.innerHTML = `
          <div class="flex justify-between items-center mb-1.5">
            <span class="text-[9px] font-bold uppercase text-teal-700 bg-teal-50 px-2 py-0.5 rounded border border-teal-100">${q.categoria}</span>
            <span class="text-[11px] text-slate-400 font-medium"><i class="fa-regular fa-clock text-[9px]"></i> ${q.tempo}</span>
          </div>
          <h3 class="font-bold text-slate-900 text-sm mb-1">${q.titulo}</h3>
          <p class="text-[11px] text-slate-500 leading-relaxed mb-2.5">${q.resumo}</p>
          <div class="flex items-center justify-between pt-2 border-t border-slate-100">
            <div class="flex gap-1 flex-wrap">
              ${q.pontos.map(cod => `<span class="bg-slate-100 text-slate-700 text-[9px] px-1.5 py-0.5 rounded font-mono font-bold">${cod}</span>`).join('')}
            </div>
            <span class="text-[11px] font-bold text-teal-800 flex items-center gap-1 shrink-0 ml-2">Ver Conduta <i class="fa-solid fa-chevron-right text-[9px]"></i></span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderizarPontosMeridiano() {
      const container = document.getElementById("tabPontos");
      const termo = normalizarTexto(document.getElementById("searchInput").value);
      container.innerHTML = "";

      const chaves = Object.keys(BANCO_PONTOS_MTC);
      const filtrados = chaves.filter(cod => {
        const p = BANCO_PONTOS_MTC[cod];
        const matchMeridiano = (meridianoAtual === "TODOS" || p.canal === meridianoAtual);
        if (!matchMeridiano) return false;
        if (!termo) return true;
        return normalizarTexto(cod).includes(termo) || normalizarTexto(p.nome).includes(termo) || normalizarTexto(p.local).includes(termo) || normalizarTexto(p.funcao).includes(termo);
      });

      document.getElementById("counterBadge").innerText = `${filtrados.length} Pontos`;

      if (filtrados.length === 0) {
        container.innerHTML = `<div class="text-center py-16 text-slate-400"><p class="text-xs font-semibold">Nenhum ponto encontrado.</p></div>`;
        return;
      }

      filtrados.forEach(cod => {
        const p = BANCO_PONTOS_MTC[cod];
        container.innerHTML += `
          <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-xs hover:border-teal-400 transition">
            <div class="flex items-center justify-between mb-1">
              <div class="flex items-center gap-2">
                <span class="bg-teal-800 text-white text-xs font-black px-2 py-0.5 rounded font-mono">${cod}</span>
                <span class="text-xs font-black text-slate-900">${p.nome}</span>
              </div>
              <span class="text-[9px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-bold border border-slate-200 uppercase">Canal ${p.canal}</span>
            </div>
            <p class="text-xs text-slate-600 mt-2 leading-relaxed"><strong class="text-slate-800">Localização:</strong> ${p.local}</p>
            <p class="text-xs text-teal-900 mt-1 leading-relaxed"><strong class="text-teal-800">Ação:</strong> ${p.funcao}</p>
          </div>
        `;
      });
    }

    function executarBusca() {
      document.getElementById("clearBtn").classList.toggle("hidden", document.getElementById("searchInput").value.length === 0);
      abaAtual === "protocolos" ? filtrarProtocolos() : renderizarPontosMeridiano();
    }

    function filtrarProtocolos() {
      const termo = normalizarTexto(document.getElementById("searchInput").value);
      const filtrados = PROTOCOLOS.filter(item => {
        const matchCat = (categoriaAtual === "Todos" || item.categoria === categoriaAtual);
        if (!matchCat) return false;
        if (!termo) return true;
        return normalizarTexto(item.titulo).includes(termo) || normalizarTexto(item.resumo).includes(termo) || item.pontos.some(cod => normalizarTexto(cod).includes(termo));
      });
      renderizarProtocolos(filtrados);
    }

    function selecionarCategoria(cat, elemento) {
      categoriaAtual = cat;
      document.querySelectorAll(".cat-pill").forEach(btn => btn.className = "cat-pill px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap bg-slate-100 text-slate-600");
      elemento.className = "cat-pill active px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap bg-teal-800 text-white";
      filtrarProtocolos();
    }

    function limparBusca() {
      document.getElementById("searchInput").value = "";
      executarBusca();
      document.getElementById("searchInput").focus();
    }

    function abrirModal(id) {
      const q = PROTOCOLOS.find(item => item.id === id);
      if (!q) return;
      document.getElementById("modalCategoria").innerText = q.categoria;
      document.getElementById("modalTitulo").innerText = q.titulo;
      document.getElementById("modalResumo").innerText = q.resumo;
      document.getElementById("modalContraindicacoes").innerText = q.contraindicacao;
      document.getElementById("modalTempoVentosa").innerText = q.tempo;
      document.getElementById("modalVentosaDesc").innerText = q.ventosa;
      document.getElementById("modalMassagemDesc").innerText = q.massagem;
      document.getElementById("modalPontosList").innerHTML = q.pontos.map(cod => {
        const p = BANCO_PONTOS_MTC[cod] || { nome: "Ponto MTC", local: "Referência anatômica", funcao: "Estímulo" };
        return `
          <div class="bg-slate-50 border border-slate-200 rounded-xl p-2.5">
            <div class="flex items-center gap-1.5 mb-1">
              <span class="bg-teal-800 text-white text-[10px] font-bold px-1.5 py-0.5 rounded font-mono">${cod}</span>
              <span class="text-xs font-bold text-slate-900">${p.nome}</span>
            </div>
            <p class="text-[11px] text-slate-600"><strong class="text-slate-700">Palpação:</strong> ${p.local}</p>
            <p class="text-[11px] text-teal-900 mt-0.5"><strong class="text-teal-800">Ação:</strong> ${p.funcao}</p>
          </div>
        `;
      }).join('');
      document.getElementById("protocolModal").classList.remove("hidden");
    }

    function fecharModal() { document.getElementById("protocolModal").classList.add("hidden"); }

    inicializarBarraMeridianos();
    carregarBancoPontos();
    mudarAba("protocolos");
  </script>
</body>
</html>
